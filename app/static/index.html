<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Report Explainer</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#5f6368;--card:#f4f6f8;--accent:#0b6e4f}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#eceff1;--muted:#a0a7ad;--card:#1d2125;--accent:#4fc39a}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:20px 16px}
h1{font-size:1.5rem;margin:.2em 0}.muted{color:var(--muted)}
.card{background:var(--card);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;margin:10px 0 6px;font-weight:600}
input[type=file],select,input[type=number]{width:100%;font-size:1rem;padding:10px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);box-sizing:border-box}
button{width:100%;font-size:1.1rem;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;margin-top:16px}
#err{color:#c62828}
</style></head><body><main>
<h1>Understand your lab report</h1>
<p class="muted">Upload the PDF from the lab, or a clear photo. We mark what's worth asking your doctor about, in simple words. It is not a diagnosis.</p>
<form id="f" class="card">
  <label for="file">Upload report (PDF or photo)</label>
  <input id="file" name="file" type="file" accept="application/pdf,image/*" required>
  <label for="preg">Are you pregnant?</label>
  <select id="preg" name="pregnant"><option value="no">No</option><option value="yes">Yes</option><option value="unsure">Not sure</option></select>
  <div id="wk" hidden><label for="weeks">How many weeks?</label><input id="weeks" name="weeks" type="number" min="1" max="42"></div>
  <button id="go">Explain my report</button><p id="err"></p>
</form>
<p class="muted">Your report is processed on our own computer, not by any AI company, and deleted within 24 hours.</p>
</main><script>
const f=document.getElementById('f'),preg=document.getElementById('preg');
preg.onchange=()=>document.getElementById('wk').hidden=preg.value!=='yes';
f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('go');b.disabled=true;b.textContent='Uploading…';
 const fd=new FormData(f);fd.append('shop',new URLSearchParams(location.search).get('shop')||'');
 const r=await fetch('/api/jobs',{method:'POST',body:fd});
 if(!r.ok){document.getElementById('err').textContent=(await r.json()).detail||'Upload failed';b.disabled=false;b.textContent='Explain my report';return}
 location.href='/r/'+(await r.json()).id};
</script></body></html>
